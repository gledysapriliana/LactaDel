name: lactadel
description: "Aplikasi edukasi untuk Ayah dalam mendukung ibu primipara memberikan ASI eksklusif."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.5.3

  # Firebase (Tahap 3)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  google_sign_in: ^6.2.2

  # Utilitas (Tahap 4)
  url_launcher: ^6.3.1
  video_player: ^2.9.6

  # Notifikasi lokal (Tahap 5)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/video/
